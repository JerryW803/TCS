<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JerryW 贪吃蛇</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        .game-wrapper {
            background: #16213e;
            padding: 30px 40px 40px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #0f3460 inset;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶栏 */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #e0e0e0;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-box {
            background: #0f3460;
            padding: 8px 22px;
            border-radius: 40px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
            color: #fff;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-box span {
            color: #ffd700;
            font-size: 24px;
            min-width: 40px;
            text-align: center;
        }

        /* 画布容器 */
        .canvas-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 0 3px #0f3460, 0 12px 28px rgba(0, 0, 0, 0.5);
            background: #0d1b2a;
        }

        canvas {
            display: block;
            width: 500px;
            height: 500px;
            background: #0d1b2a;
        }

        /* 暂停遮罩 */
        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            pointer-events: none;
            z-index: 5;
        }

        .pause-overlay.show {
            display: flex;
        }

        .pause-overlay .pause-text {
            color: #ffd700;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.06);
            }
        }

        /* 游戏结束遮罩 */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            transition: opacity 0.25s ease;
            z-index: 10;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-overlay h2 {
            color: #ff6b6b;
            font-size: 42px;
            font-weight: 800;
            text-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .game-over-overlay .final-score {
            color: #f0f0f0;
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .game-over-overlay .final-score strong {
            color: #ffd700;
            font-size: 28px;
        }

        .btn {
            background: linear-gradient(145deg, #f7971e, #f5a623);
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 6px 0 #b36b0e, 0 8px 20px rgba(247, 151, 30, 0.3);
            transition: all 0.08s ease-in;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b36b0e, 0 12px 28px rgba(247, 151, 30, 0.4);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b36b0e, 0 8px 20px rgba(247, 151, 30, 0.3);
        }

        /* 底部控制 */
        .footer-controls {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding: 0 4px;
            gap: 10px;
        }

        .key-hint {
            color: #8899bb;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .key-hint kbd {
            background: #0f3460;
            color: #e0e0e0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            box-shadow: inset 0 -2px 0 #1a1a2e;
        }

        .restart-btn {
            background: #1e3a5f;
            box-shadow: 0 4px 0 #0f1f33, 0 6px 16px rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            padding: 8px 24px;
            font-size: 16px;
        }

        .restart-btn:hover {
            background: #264d7a;
            box-shadow: 0 6px 0 #0f1f33, 0 10px 24px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .restart-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1f33, 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        /* 暂停按钮 */
        .pause-btn {
            background: #2a4a6a;
            box-shadow: 0 4px 0 #0f1f33, 0 6px 16px rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            padding: 8px 24px;
            font-size: 16px;
            min-width: 80px;
        }

        .pause-btn:hover {
            background: #3a5a7a;
            box-shadow: 0 6px 0 #0f1f33, 0 10px 24px rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .pause-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1f33, 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .pause-btn.is-paused {
            background: #4a6a3a;
            box-shadow: 0 4px 0 #2a4a1a, 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .pause-btn.is-paused:hover {
            background: #5a7a4a;
            box-shadow: 0 6px 0 #2a4a1a, 0 10px 24px rgba(0, 0, 0, 0.4);
        }

        /* 速度滑块 */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c0d0e0;
            font-size: 15px;
            font-weight: 500;
        }

        .speed-control input[type="range"] {
            width: 130px;
            height: 4px;
            -webkit-appearance: none;
            background: #2a4a6a;
            border-radius: 4px;
            outline: none;
        }

        .speed-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .speed-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffd700;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .speed-label {
            min-width: 70px;
            text-align: center;
            background: #0f3460;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            color: #ffd700;
            font-size: 15px;
        }

        /* 响应式 */
        @media (max-width: 580px) {
            .game-wrapper {
                padding: 20px 16px 28px;
                border-radius: 20px;
                width: 96vw;
            }

            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
            }

            .header h1 {
                font-size: 22px;
            }

            .score-box {
                font-size: 16px;
                padding: 6px 16px;
            }
            .score-box span {
                font-size: 20px;
                min-width: 30px;
            }

            .game-over-overlay h2 {
                font-size: 30px;
            }

            .btn {
                padding: 10px 28px;
                font-size: 17px;
            }

            .footer-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .key-hint {
                justify-content: center;
                flex-wrap: wrap;
                gap: 8px 14px;
                font-size: 14px;
            }

            .restart-btn,
            .pause-btn {
                width: 100%;
                text-align: center;
            }

            .speed-control {
                justify-content: center;
                flex-wrap: wrap;
            }

            .speed-control input[type="range"] {
                width: 100px;
            }

            .pause-overlay .pause-text {
                font-size: 32px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 18px;
            }
            .score-box {
                font-size: 14px;
                padding: 4px 12px;
            }
            .score-box span {
                font-size: 17px;
                min-width: 24px;
            }
            .game-over-overlay h2 {
                font-size: 24px;
            }
            .btn {
                padding: 8px 20px;
                font-size: 15px;
            }
            .pause-overlay .pause-text {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- 顶栏 -->
        <div class="header">
            <h1>JerryW</h1>
            <div class="score-box">
                🍎 <span id="scoreDisplay">0</span>
            </div>
        </div>

        <!-- 画布 + 遮罩 -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="500" height="500"></canvas>

            <!-- 暂停遮罩 -->
            <div class="pause-overlay" id="pauseOverlay">
                <div class="pause-text">⏸ 已暂停</div>
            </div>

            <!-- 游戏结束遮罩 -->
            <div class="game-over-overlay" id="gameOverOverlay">
                <h2 id="overlayTitle">GAMEOVER</h2>
                <div class="final-score">
                    得分 &nbsp; <strong id="finalScore">0</strong>
                </div>
                <button class="btn" id="restartOverlayBtn">🔄 再来一局</button>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer-controls">
            <div class="key-hint">
                <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd>
                <span style="color:#667799;">或</span>
                <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
                <span style="color:#667799; margin-left:4px;">|</span>
                <kbd>空格</kbd> <span style="color:#667799;">暂停</span>
            </div>

            <!-- 速度滑块 -->
            <div class="speed-control">
                <span>⚡ 速度</span>
                <input type="range" id="speedSlider" min="50" max="500" value="250" step="5" />
                <span class="speed-label" id="speedDisplay">250</span>
            </div>

            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn pause-btn" id="pauseBtn">⏸ 暂停</button>
                <button class="btn restart-btn" id="restartBtn">⟳ 重新开始</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  贪吃蛇 — 手动调速版 + 暂停功能
        // ============================================================

        (function() {
            'use strict';

            // ---------- DOM ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const finalScoreSpan = document.getElementById('finalScore');
            const overlay = document.getElementById('gameOverOverlay');
            const overlayTitle = document.getElementById('overlayTitle');
            const restartOverlayBtn = document.getElementById('restartOverlayBtn');
            const restartBtn = document.getElementById('restartBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const pauseOverlay = document.getElementById('pauseOverlay');
            const speedSlider = document.getElementById('speedSlider');
            const speedDisplay = document.getElementById('speedDisplay');

            // ---------- 常量 ----------
            const GRID_SIZE = 20;
            const CELL_SIZE = canvas.width / GRID_SIZE;

            const DIR = {
                UP: { x: 0, y: -1 },
                DOWN: { x: 0, y: 1 },
                LEFT: { x: -1, y: 0 },
                RIGHT: { x: 1, y: 0 }
            };

            // ---------- 状态 ----------
            let snake = [];
            let food = { x: 8, y: 10 };
            let direction = DIR.RIGHT;
            let nextDirection = DIR.RIGHT;
            let score = 0;
            let gameRunning = false;
            let gameLoopInterval = null;
            let animationFrame = null;
            let gameOverFlag = false;

            // 暂停状态
            let isPaused = false;

            // 速度 (毫秒/帧)
            let moveIntervalMs = 250;

            // ---------- 更新速度显示（带图标） ----------
            function updateSpeedDisplay() {
                let icon = '';
                if (moveIntervalMs <= 200) {
                    icon = '✈️ ';
                } else if (moveIntervalMs >= 350) {
                    icon = '🐢 ';
                }
                speedDisplay.textContent = icon + moveIntervalMs;
            }

            // ---------- 更新暂停按钮和遮罩 ----------
            function updatePauseUI() {
                if (isPaused) {
                    pauseBtn.textContent = '▶ 继续';
                    pauseBtn.classList.add('is-paused');
                    pauseOverlay.classList.add('show');
                } else {
                    pauseBtn.textContent = '⏸ 暂停';
                    pauseBtn.classList.remove('is-paused');
                    pauseOverlay.classList.remove('show');
                }
            }

            // ---------- 暂停切换 ----------
            function togglePause() {
                if (!gameRunning || gameOverFlag) return;
                isPaused = !isPaused;
                updatePauseUI();

                if (isPaused) {
                    // 暂停：清除计时器
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                } else {
                    // 继续：重启计时器
                    if (!gameLoopInterval) {
                        startLoop();
                    }
                }
            }

            // ---------- 初始化 / 重置 ----------
            function initGame() {
                snake = [
                    { x: 9, y: 10 },
                    { x: 8, y: 10 },
                    { x: 7, y: 10 },
                    { x: 6, y: 10 }
                ];
                direction = DIR.RIGHT;
                nextDirection = DIR.RIGHT;
                score = 0;
                gameOverFlag = false;
                isPaused = false;
                updateScoreDisplay();
                updatePauseUI();

                moveIntervalMs = parseInt(speedSlider.value, 10);
                updateSpeedDisplay();

                generateFood();
                overlay.classList.remove('show');
                overlayTitle.textContent = 'GAMEOVER';

                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }

                gameRunning = true;
                startLoop();
                renderLoop();
            }

            // ---------- 启动循环 ----------
            function startLoop() {
                if (gameLoopInterval) clearInterval(gameLoopInterval);
                gameLoopInterval = setInterval(gameTick, moveIntervalMs);
            }

            // ---------- 生成食物 ----------
            function generateFood() {
                const totalCells = GRID_SIZE * GRID_SIZE;
                if (snake.length >= totalCells) {
                    food = { x: -1, y: -1 };
                    return;
                }

                const occupied = new Set(snake.map(cell => `${cell.x},${cell.y}`));
                if (occupied.size === totalCells) {
                    food = { x: -1, y: -1 };
                    return;
                }

                let attempts = 0;
                const maxAttempts = 2000;
                let newFood = null;
                while (attempts < maxAttempts) {
                    const fx = Math.floor(Math.random() * GRID_SIZE);
                    const fy = Math.floor(Math.random() * GRID_SIZE);
                    if (!occupied.has(`${fx},${fy}`)) {
                        newFood = { x: fx, y: fy };
                        break;
                    }
                    attempts++;
                }

                if (!newFood) {
                    for (let y = 0; y < GRID_SIZE; y++) {
                        for (let x = 0; x < GRID_SIZE; x++) {
                            if (!occupied.has(`${x},${y}`)) {
                                newFood = { x, y };
                                break;
                            }
                        }
                        if (newFood) break;
                    }
                }

                food = newFood || { x: 0, y: 0 };
            }

            // ---------- 游戏 tick ----------
            function gameTick() {
                if (!gameRunning || gameOverFlag || isPaused) return;

                direction = { ...nextDirection };

                const head = snake[0];
                const newHead = {
                    x: head.x + direction.x,
                    y: head.y + direction.y
                };

                const isEating = (newHead.x === food.x && newHead.y === food.y);

                let newSnake = [newHead, ...snake];
                if (!isEating) {
                    newSnake.pop();
                }

                const headCollision = (() => {
                    if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                        return true;
                    }
                    for (let i = 1; i < newSnake.length; i++) {
                        if (newSnake[i].x === newHead.x && newSnake[i].y === newHead.y) {
                            return true;
                        }
                    }
                    return false;
                })();

                if (headCollision) {
                    endGame();
                    return;
                }

                snake = newSnake;

                if (isEating) {
                    score++;
                    updateScoreDisplay();
                    generateFood();

                    if (food.x === -1 && food.y === -1) {
                        gameRunning = false;
                        gameOverFlag = true;
                        if (gameLoopInterval) {
                            clearInterval(gameLoopInterval);
                            gameLoopInterval = null;
                        }
                        overlayTitle.textContent = 'YOU WIN!';
                        finalScoreSpan.textContent = score;
                        overlay.classList.add('show');
                        return;
                    }
                }
            }

            // ---------- 渲染循环 ----------
            function renderLoop() {
                drawCanvas();
                animationFrame = requestAnimationFrame(renderLoop);
            }

            // ---------- 绘图 (方块版) ----------
            function drawCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 网格
                ctx.strokeStyle = '#1e3349';
                ctx.lineWidth = 0.6;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(canvas.width, i * CELL_SIZE);
                    ctx.stroke();
                }

                // ---- 食物 (蓝色方块) ----
                if (food && food.x >= 0 && food.y >= 0) {
                    const fx = food.x * CELL_SIZE;
                    const fy = food.y * CELL_SIZE;
                    const padding = 2;
                    const size = CELL_SIZE - padding * 2;

                    ctx.shadowColor = 'rgba(50, 150, 255, 0.5)';
                    ctx.shadowBlur = 14;
                    ctx.fillStyle = '#4dabf7';
                    ctx.fillRect(fx + padding, fy + padding, size, size);

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillRect(fx + padding + 2, fy + padding + 2, size * 0.4, size * 0.3);

                    ctx.strokeStyle = '#1c7ed6';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(fx + padding, fy + padding, size, size);
                    ctx.shadowBlur = 0;
                }

                // ---- 蛇 (绿色方块) ----
                if (snake.length === 0) return;

                for (let i = 0; i < snake.length; i++) {
                    const seg = snake[i];
                    const x = seg.x * CELL_SIZE;
                    const y = seg.y * CELL_SIZE;
                    const padding = i === 0 ? 1 : 2;
                    const size = CELL_SIZE - padding * 2;

                    let color;
                    if (i === 0) {
                        color = '#51cf66';
                    } else {
                        const ratio = 1 - (i / snake.length) * 0.4;
                        const g = Math.round(180 + 75 * ratio);
                        color = `rgb(40, ${g}, 70)`;
                    }

                    ctx.shadowColor = i === 0 ? 'rgba(80, 200, 80, 0.5)' : 'rgba(0,0,0,0.2)';
                    ctx.shadowBlur = i === 0 ? 12 : 4;

                    ctx.fillStyle = color;
                    ctx.fillRect(x + padding, y + padding, size, size);

                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = i === 0 ? '#2b8a3e' : '#1a4a2a';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + padding, y + padding, size, size);

                    // 头部眼睛
                    if (i === 0) {
                        ctx.fillStyle = '#f0f0f0';
                        const eyeSize = 4;
                        let ex1, ey1, ex2, ey2;
                        const d = direction;
                        const cx = x + CELL_SIZE / 2;
                        const cy = y + CELL_SIZE / 2;
                        if (d.x === 1) {
                            ex1 = cx + 5;
                            ey1 = cy - 6;
                            ex2 = cx + 5;
                            ey2 = cy + 2;
                        } else if (d.x === -1) {
                            ex1 = cx - 9;
                            ey1 = cy - 6;
                            ex2 = cx - 9;
                            ey2 = cy + 2;
                        } else if (d.y === -1) {
                            ex1 = cx - 6;
                            ey1 = cy - 9;
                            ex2 = cx + 2;
                            ey2 = cy - 9;
                        } else {
                            ex1 = cx - 6;
                            ey1 = cy + 5;
                            ex2 = cx + 2;
                            ey2 = cy + 5;
                        }
                        ctx.fillRect(ex1, ey1, eyeSize, eyeSize);
                        ctx.fillRect(ex2, ey2, eyeSize, eyeSize);
                        ctx.fillStyle = '#1a1a2e';
                        const pupilOff = 1.5;
                        ctx.fillRect(ex1 + d.x * pupilOff, ey1 + d.y * pupilOff, 2, 2);
                        ctx.fillRect(ex2 + d.x * pupilOff, ey2 + d.y * pupilOff, 2, 2);
                    }
                }
                ctx.shadowBlur = 0;
            }

            // ---------- 更新分数 ----------
            function updateScoreDisplay() {
                scoreSpan.textContent = score;
            }

            // ---------- 结束游戏 ----------
            function endGame() {
                if (gameOverFlag) return;
                gameRunning = false;
                gameOverFlag = true;
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                // 如果暂停中，取消暂停状态
                if (isPaused) {
                    isPaused = false;
                    updatePauseUI();
                }
                finalScoreSpan.textContent = score;
                overlayTitle.textContent = 'GAMEOVER';
                overlay.classList.add('show');
            }

            // ---------- 方向控制 ----------
            function setDirection(newDir) {
                if (!gameRunning || gameOverFlag || isPaused) return;
                if (direction.x === -newDir.x && direction.y === -newDir.y) {
                    return;
                }
                nextDirection = { ...newDir };
            }

            // ---------- 键盘 ----------
            function handleKeydown(e) {
                const key = e.key;
                const controlKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'W', 'A', 'a', 's', 'S', 'd', 'D',
                    ' ', 'Space'
                ];
                if (controlKeys.includes(key)) {
                    e.preventDefault();
                }

                switch (key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        setDirection(DIR.UP);
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        setDirection(DIR.DOWN);
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        setDirection(DIR.LEFT);
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        setDirection(DIR.RIGHT);
                        break;
                    case ' ':
                    case 'Space':
                        togglePause();
                        break;
                    case 'r':
                    case 'R':
                        restartGame();
                        break;
                    default:
                        break;
                }
            }

            // ---------- 速度调节 ----------
            function updateSpeed() {
                const val = parseInt(speedSlider.value, 10);
                moveIntervalMs = val;
                updateSpeedDisplay();
                if (gameRunning && !gameOverFlag && !isPaused) {
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                    startLoop();
                }
            }

            // ---------- 重新开始 ----------
            function restartGame() {
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                initGame();
            }

            // ---------- 启动 ----------
            function startGame() {
                window.addEventListener('keydown', handleKeydown);
                restartBtn.addEventListener('click', restartGame);
                restartOverlayBtn.addEventListener('click', restartGame);
                pauseBtn.addEventListener('click', togglePause);

                speedSlider.addEventListener('input', updateSpeed);
                moveIntervalMs = parseInt(speedSlider.value, 10);
                updateSpeedDisplay();

                initGame();
            }

            window.addEventListener('DOMContentLoaded', startGame);
        })();
    </script>

</body>
</html>
